<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Royale UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="br-container" class="hidden">
        <div class="header">
            <h1>BATTLE ROYALE</h1>
        </div>
        <div class="info-panel">
            <div class="info-item">
                <span class="label">Spieler</span>
                <span id="players" class="value">100 / 100</span>
            </div>
            <div class="info-item">
                <span class="label">Zone in</span>
                <span id="shrink-timer" class="value">02:00</span>
            </div>
            <div class="info-item">
                <span class="label">Spielzeit</span>
                <span id="game-timer" class="value">30:00</span>
            </div>
        </div>
        <div id="kill-feed">
            <!-- Kill-Feed-Einträge werden hier dynamisch hinzugefügt -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
